<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cute Logic Run AR - Slow Version</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Nunito:wght@700;900&display=swap');
        
        body { margin: 0; overflow: hidden; background-color: #fdf2f8; font-family: 'Mali', cursive; touch-action: none; user-select: none; }
        
        #video-bg { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; transform: scaleX(-1); opacity: 0.6; }
        
        #pastel-overlay { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 192, 203, 0.4), rgba(173, 216, 230, 0.4)); z-index: 2; pointer-events: none; }
        
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; }
        #motion-canvas { display: none; }
        
        .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; }
        .pointer-events-auto { pointer-events: auto; }
        
        .zone-indicator { flex: 1; border-right: 3px dashed rgba(255, 182, 193, 0.5); position: relative; }
        .zone-indicator:last-child { border-right: none; }
        .zone-highlight { position: absolute; inset: 0; background: linear-gradient(to top, rgba(255, 192, 203, 0.4) 0%, transparent 100%); opacity: 0; transition: opacity 0.2s ease-out; }
        
        .cute-box {
            background: rgba(255, 255, 255, 0.85);
            border: 4px solid #ffb6c1;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 182, 193, 0.5), inset 0 0 15px rgba(255, 255, 255, 1);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <video id="video-bg" autoplay playsinline muted></video>
    <div id="pastel-overlay"></div>
    <canvas id="motion-canvas" width="64" height="48"></canvas>
    <canvas id="game-canvas"></canvas>

    <div id="game-ui" class="ui-layer hidden">
        <div class="flex justify-between items-start p-6">
            <div class="bg-white/90 border-4 border-pink-300 rounded-2xl px-6 py-2 flex items-center gap-3 shadow-[0_5px_15px_rgba(255,182,193,0.6)]">
                <span class="text-pink-400 text-3xl">⭐</span>
                <span id="score-text" class="text-pink-500 text-4xl font-black font-['Nunito']">0</span>
            </div>
            
            <div class="flex gap-2 bg-white/70 px-4 py-2 rounded-full border-2 border-pink-200" id="health-bar">
                <span class="text-pink-500 text-2xl drop-shadow-md" id="hp-1">💖</span>
                <span class="text-pink-500 text-2xl drop-shadow-md" id="hp-2">💖</span>
                <span class="text-pink-500 text-2xl drop-shadow-md" id="hp-3">💖</span>
            </div>
        </div>

        <div class="absolute top-8 left-1/2 transform -translate-x-1/2 cute-box px-12 py-4 text-center z-20 min-w-[280px]">
            <div class="text-pink-400 text-sm font-bold mb-1">น้องกระต่ายเลือกคำตอบไหนดี?</div>
            <div id="question-text" class="text-5xl font-black text-gray-700 tracking-wide font-['Nunito']">T ∧ F</div>
        </div>

        <div class="flex-grow flex w-full mt-28">
            <div class="zone-indicator"><div class="zone-highlight" id="zone-0"></div></div>
            <div class="zone-indicator"><div class="zone-highlight" id="zone-1"></div></div>
            <div class="zone-indicator"><div class="zone-highlight" id="zone-2"></div></div>
        </div>

        <div class="p-6 text-center pointer-events-auto flex justify-between items-end">
            <button onclick="flipCamera()" class="bg-white p-4 rounded-full border-2 border-pink-300 text-pink-400 hover:text-pink-600 hover:bg-pink-50 transition shadow-lg">
                <i class="fa-solid fa-camera-rotate text-xl"></i>
            </button>
            <div class="text-pink-500 font-bold bg-white/90 border-2 border-pink-300 px-6 py-3 rounded-full text-base shadow-lg">
                👋 โบกมือ ซ้าย-ขวา เพื่อสลับเลน
            </div>
            <div class="w-16"></div>
        </div>
    </div>

    <!-- หน้าเมนูเริ่มเกม -->
    <div id="start-menu" class="absolute inset-0 z-50 flex items-center justify-center bg-pink-50/60 backdrop-blur-md pointer-events-auto">
        <div class="cute-box p-10 max-w-sm w-full text-center">
            <div class="text-6xl mb-4">🐰✨</div>
            <h1 class="text-4xl font-black text-pink-500 mb-2 font-['Nunito']">Logic Run</h1>
            <p class="text-gray-500 mb-6 font-bold text-sm">ตรรกศาสตร์ ม.4 (โหมดคิดวิเคราะห์)</p>
            
            <div class="bg-pink-50 p-5 rounded-2xl text-left text-sm text-gray-600 space-y-4 mb-8 border border-pink-100">
                <p class="flex items-center gap-2"><span>👋</span> <b>บังคับ:</b> โบกมือซ้าย-ขวา เพื่อย้ายเลน</p>
                <p class="flex items-center gap-2"><span>🫧</span> <b>เป้าหมาย:</b> ชนฟองสบู่คำตอบ (T/F) ที่ถูกต้อง</p>
                <p class="flex items-center gap-2"><span>🍄</span> <b>ระวัง:</b> ชนเห็ดพิษ หรือคำตอบผิด เสีย 1 💖</p>
            </div>
            
            <button onclick="startGame()" class="w-full bg-pink-400 text-white font-black py-4 rounded-full text-xl hover:bg-pink-500 hover:scale-105 transition duration-200 shadow-[0_8px_0_#d81b60]">
                เริ่มเล่นเลย!
            </button>
        </div>
    </div>

    <!-- หน้า Game Over -->
    <div id="game-over" class="absolute inset-0 z-50 hidden items-center justify-center bg-gray-900/60 backdrop-blur-md pointer-events-auto">
        <div class="cute-box p-10 text-center">
            <h2 class="text-5xl font-black text-pink-500 mb-2 font-['Nunito']">โอ๊ะโอ! หมดเวลาสนุก</h2>
            <p class="text-2xl text-gray-600 mb-8 font-bold mt-4">ได้คะแนนไป: <span id="final-score" class="text-pink-500 text-4xl">0</span> ⭐</p>
            <button onclick="resetGame()" class="bg-pink-400 text-white font-black py-4 px-10 rounded-full text-xl hover:bg-pink-500 hover:scale-105 transition shadow-[0_8px_0_#d81b60]">
                เล่นอีกครั้ง 🐰
            </button>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        
        function playSound(type) {
            if(!audioCtx || audioCtx.state !== 'running') return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            
            if(type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if(type === 'wrong') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if(type === 'move') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            }
        }

        const video = document.getElementById('video-bg');
        const motionCanvas = document.getElementById('motion-canvas');
        const motionCtx = motionCanvas.getContext('2d', { willReadFrequently: true });
        let prevImg = null;
        let stream = null;
        let facingMode = 'user';

        async function initCamera() {
            if(stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facingMode, width: 320, height: 240 } });
                video.srcObject = stream;
                video.style.transform = facingMode === 'user' ? 'scaleX(-1)' : 'scaleX(1)';
            } catch(e) { alert("กรุณาเปิดสิทธิการใช้งานกล้องครับ"); }
        }

        function flipCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            initCamera();
        }

        const gc = document.getElementById('game-canvas');
        const ctx = gc.getContext('2d');
        let gameActive = false;
        let score = 0;
        let hp = 3;
        
        let playerLane = 1; 
        let targetLane = 1; 
        let visualLane = 1; 

        let items = []; 
        // ปรับความเร็วให้ช้าลงมากๆ เพื่อให้ลอยมาแบบชิลๆ
        let speed = 0.004; 
        
        const logicQuestions = [
            { q: "T ∧ T", a: true }, { q: "T ∧ F", a: false }, { q: "F ∧ F", a: false },
            { q: "T ∨ F", a: true }, { q: "F ∨ F", a: false }, { q: "T ∨ T", a: true },
            { q: "T → F", a: false }, { q: "F → T", a: true }, { q: "F → F", a: true }, { q: "T → T", a: true },
            { q: "T ↔ F", a: false }, { q: "T ↔ T", a: true }, { q: "F ↔ F", a: true },
            { q: "~(T ∧ F)", a: true }, { q: "~(F ∨ F)", a: true }, { q: "~T ∨ T", a: true }
        ];
        let currentQ = null;

        function resizeCanvas() {
            gc.width = window.innerWidth;
            gc.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startGame() {
            if(!audioCtx) audioCtx = new AudioContext();
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0; osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(0); osc.stop(audioCtx.currentTime + 0.1);

            document.getElementById('start-menu').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            
            initCamera();
            resetGame();
            requestAnimationFrame(gameLoop);
        }

        function resetGame() {
            score = 0;
            hp = 3;
            speed = 0.004; // รีเซ็ตกลับมาที่ความเร็วเริ่มต้น (ช้าๆ)
            items = [];
            playerLane = 1;
            visualLane = 1;
            targetLane = 1;
            gameActive = true;
            document.getElementById('game-over').classList.add('hidden');
            updateUI();
        }

        function updateUI() {
            document.getElementById('score-text').innerText = score;
            for(let i=1; i<=3; i++) {
                document.getElementById(`hp-${i}`).style.opacity = i <= hp ? '1' : '0.3';
                document.getElementById(`hp-${i}`).style.filter = i <= hp ? 'none' : 'grayscale(100%)';
            }
            if(hp <= 0) gameOver();
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('final-score').innerText = score;
            document.getElementById('game-over').classList.remove('hidden');
            document.getElementById('game-over').classList.add('flex');
        }

        let motionCooldown = 0;
        function processMotion() {
            if(!gameActive || !video.videoWidth) return;
            
            motionCtx.drawImage(video, 0, 0, 64, 48);
            const currImg = motionCtx.getImageData(0, 0, 64, 48);
            
            if(prevImg && motionCooldown <= 0) {
                let laneMotion = [0, 0, 0];
                
                for(let y=0; y<48; y+=2) {
                    for(let x=0; x<64; x+=2) {
                        const i = (y*64 + x)*4;
                        const diff = Math.abs(currImg.data[i]-prevImg.data[i]) + 
                                     Math.abs(currImg.data[i+1]-prevImg.data[i+1]) + 
                                     Math.abs(currImg.data[i+2]-prevImg.data[i+2]);
                        
                        if(diff > 35) { 
                            let mapX = x/64;
                            if(facingMode === 'user') mapX = 1 - mapX;
                            
                            if(mapX < 0.33) laneMotion[0]++;
                            else if(mapX < 0.66) laneMotion[1]++;
                            else laneMotion[2]++;
                        }
                    }
                }

                let maxMotion = Math.max(...laneMotion);
                if(maxMotion > 10) { 
                    let newLane = laneMotion.indexOf(maxMotion);
                    if(newLane !== targetLane) {
                        targetLane = newLane;
                        playSound('move');
                        motionCooldown = 15;
                        
                        document.querySelectorAll('.zone-highlight').forEach(el => el.style.opacity = '0');
                        document.getElementById(`zone-${targetLane}`).style.opacity = '1';
                        setTimeout(() => { document.getElementById(`zone-${targetLane}`).style.opacity = '0'; }, 300);
                    }
                }
            }
            if(motionCooldown > 0) motionCooldown--;
            prevImg = currImg;
        }

        function get3DPos(laneIndex, distanceZ) {
            const vpX = gc.width / 2;
            const vpY = gc.height * 0.35; 
            const bottomY = gc.height * 0.95;
            
            const easeZ = Math.pow(distanceZ, 1.5); 
            const y = vpY + (bottomY - vpY) * easeZ;
            
            const laneWidthAtBottom = gc.width * 0.32;
            const laneWidthAtTop = gc.width * 0.05;
            
            const currentLaneWidth = laneWidthAtTop + (laneWidthAtBottom - laneWidthAtTop) * easeZ;
            const x = vpX + (laneIndex - 1) * currentLaneWidth;
            const scale = 0.3 + 2.2 * easeZ; 
            
            return { x, y, scale };
        }

        function spawnQuestionWave() {
            currentQ = logicQuestions[Math.floor(Math.random() * logicQuestions.length)];
            document.getElementById('question-text').innerText = currentQ.q;
            
            let lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
            
            items.push({ lane: lanes[0], z: 0.01, type: 'answer', isTrueObj: true, text: 'T', active: true });
            items.push({ lane: lanes[1], z: 0.01, type: 'answer', isTrueObj: false, text: 'F', active: true });
            items.push({ lane: lanes[2], z: 0.01, type: 'obstacle', text: '🍄', active: true });
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if(!lastTime) lastTime = timestamp;
            const dt = timestamp - lastTime;
            lastTime = timestamp;

            if(gameActive) {
                ctx.clearRect(0, 0, gc.width, gc.height);
                processMotion();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';
                const lanesLines = [-1.5, -0.5, 0.5, 1.5];
                lanesLines.forEach(l => {
                    const top = get3DPos(l + 1, 0);
                    const bottom = get3DPos(l + 1, 1);
                    ctx.beginPath(); ctx.moveTo(top.x, top.y); ctx.lineTo(bottom.x, bottom.y); ctx.stroke();
                });

                if(items.length === 0) {
                    spawnQuestionWave();
                }

                visualLane += (targetLane - visualLane) * 0.15;
                playerLane = Math.round(visualLane); 

                for(let i = items.length - 1; i >= 0; i--) {
                    let item = items[i];
                    item.z += speed * (dt/16);
                    
                    if(item.active) {
                        const pos = get3DPos(item.lane, item.z);
                        
                        if(item.type === 'answer') {
                            ctx.beginPath();
                            ctx.arc(pos.x, pos.y - (20 * pos.scale), 35 * pos.scale, 0, Math.PI * 2);
                            ctx.fillStyle = item.isTrueObj ? 'rgba(173, 216, 230, 0.9)' : 'rgba(255, 182, 193, 0.9)';
                            ctx.fill();
                            ctx.lineWidth = 3 * pos.scale;
                            ctx.strokeStyle = '#ffffff';
                            ctx.stroke();

                            ctx.font = `900 ${45 * pos.scale}px 'Nunito', sans-serif`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'middle';
                            ctx.fillStyle = '#ffffff';
                            ctx.fillText(item.text, pos.x, pos.y - (18 * pos.scale));
                        } else {
                            ctx.font = `${60 * pos.scale}px Arial`;
                            ctx.textAlign = 'center';
                            ctx.textBaseline = 'bottom';
                            ctx.fillText(item.text, pos.x, pos.y);
                        }

                        if(item.z > 0.85 && item.z < 1.0 && item.lane === playerLane) {
                            if(item.type === 'answer') {
                                if(item.isTrueObj === currentQ.a) {
                                    playSound('correct');
                                    score += 10;
                                    gc.style.boxShadow = "inset 0 0 50px rgba(173, 216, 230, 0.8)";
                                    setTimeout(() => gc.style.boxShadow = "none", 200);
                                } else {
                                    playSound('wrong');
                                    hp--;
                                    gc.style.boxShadow = "inset 0 0 50px rgba(255, 105, 180, 0.6)";
                                    setTimeout(() => gc.style.boxShadow = "none", 200);
                                }
                            } else if (item.type === 'obstacle') {
                                playSound('wrong');
                                hp--;
                                gc.style.boxShadow = "inset 0 0 50px rgba(255, 105, 180, 0.6)";
                                setTimeout(() => gc.style.boxShadow = "none", 200);
                            }
                            
                            updateUI();
                            items.forEach(it => it.active = false); 
                        }
                    }

                    if(item.z > 1.2) items.splice(i, 1);
                }

                const playerPos = get3DPos(visualLane, 0.9);
                ctx.font = `65px Arial`; 
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.shadowColor = 'rgba(255, 182, 193, 0.8)'; 
                ctx.shadowBlur = 15;
                ctx.fillText('🐰', playerPos.x, playerPos.y + 10);
                ctx.shadowBlur = 0;

                // ลดอัตราเร่งและเพดานความเร็วสูงสุดลงมาก เพื่อให้เกมยังคงเดินช้าในด่านหลังๆ
                if(speed < 0.010) speed += 0.0000005;
            }
            
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
